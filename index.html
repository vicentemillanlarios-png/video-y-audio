
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practica de video y audio con HTML5">
    <link rel="icon" href="imagenes/favicon-32x32.png" type="image/png">
    <title>Practica Video y Audio</title>
</head>
<body>
    <h1>Practica de Video y Audio con HTML5</h1>
    <h2>Video</h2>
    <video width="600" height="400" controls>
        <source src="video/Publicar20s.mp4" type="video/mp4">
    </video>
    <h2>Audio</h2>
    <audio controls>
        <source src="audio/audio.mp3" type="audio/mpeg">
    </audio>
    <h2>Iframe: otra pagina</h2>
    <iframe src="https://www.wikipedia.org" width="600" height="400"></iframe>
    <h2>Iframe: video de YouTube</h2>
    <iframe width="600" height="400"
        src="https://www.youtube.com/embed/eKabc74IU7o?si=TCEAahVRuPlvf7qm"
        title="Video de YouTube"
        allowfullscreen>
    </iframe>
    <h2>Iframe: mapa de Google Maps</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3083.442383781076!2d-3.224483325184358!3d39.391496571622724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd69af036cec6af9%3A0x3cb32e283081ecee!2sIES%20Juan%20Bosco!5e0!3m2!1ses!2ses!4v1761657186043!5m2!1ses!2ses"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen
        loading="lazy">
    </iframe>
</body>
</html>
